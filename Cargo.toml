[package]
name = "loomex-runner"
version = "0.4.6"
edition = "2024"
rust-version = "1.88"
license = "Proprietary"
description = "Loomex per-user execution daemon and credential-free local client"

[[bin]]
name = "loomex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
time = { version = "=0.3.44", features = ["parsing"] }
unicode-general-category = "=1.1.0"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
security-framework-sys = "2.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.distribution-dev]
inherits = "dev"
opt-level = 2
debug-assertions = true
overflow-checks = true
debug = 1
incremental = false

[[bin]]
name = "loomex-runner"
path = "src/daemon_main.rs"

[[bin]]
name = "loomex-lifecycle-bootstrap"
path = "src/bootstrap_main.rs"
