[package]
name = "loomex-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
description = "Loomex per-user execution daemon and credential-free local client"

[[bin]]
name = "loomex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"

[[bin]]
name = "loomex-runner"
path = "src/daemon_main.rs"
