[package]
name = "loomex-install"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Proprietary"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
url = "2"

[profile.release]
lto = "thin"
strip = "symbols"
