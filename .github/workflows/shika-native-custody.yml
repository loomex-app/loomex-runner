name: Shika native custody qualification
on:
  workflow_dispatch:
  push:
    branches:
      - codex/shika-pairing-native-ci-20261028
permissions:
  contents: read
jobs:
  disposable-native:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # reviewed master 2026-10-04
        with:
          toolchain: 1.88.0
      - name: Qualify native custody in disposable hosted VM
        env:
          SHIKA_NATIVE_DISPOSABLE_VM: "yes"
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test -d "$RUNNER_TEMP"
          umask 077
          output="$(cargo test --locked --lib shika::native_custody::native_custody_disposable_ci -- --ignored --exact --nocapture --test-threads=1)"
          printf "%s\n" "$output"
          printf "%s\n" "$output" | grep -Fx SHIKA_NATIVE_CUSTODY_OK
