name: Shika executor diagnostic

on:
  push:
    branches:
      - codex/shika-pairing-native-ci-20261028

permissions:
  contents: read

jobs:
  current-macos-26-serialized:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # reviewed master 2026-10-04
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin
      - name: Verify architecture and test source
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin
          printf '%s  %s\n' 472dbcc07579ff16bcb6fbc16aba537bf950c8b851d0ce9e157c9b48967363df tests/executor.rs | shasum -a 256 -c
      - name: Run unchanged serialized executor suite
        shell: bash
        run: |
          set -o pipefail
          umask 077
          log=$(mktemp "$RUNNER_TEMP/shika-executor-serialized.XXXXXX")
          set +e
          cargo test --locked --test executor -- --nocapture --test-threads=1 2>&1 | tee "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          if [ "${statuses[1]}" -ne 0 ]; then exit "${statuses[1]}"; fi
          awk '
            /^running 19 tests$/ { running++ }
            /^test result: ok\. 17 passed; 0 failed; 2 ignored; 0 measured; 0 filtered out;/ { summary++ }
            END { exit !(running == 1 && summary == 1) }
          ' "$log"
